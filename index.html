<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minda Optima 2 — Pantas Baca Daily Monitoring</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#0f141a; --bg2:#161d26; --card:#1b232e; --card2:#212b38;
    --border:#2b3643; --text:#e6edf3; --muted:#9aa7b4; --accent:#4da3ff;
    --green:#4CAF50; --yellow:#FFC107; --red:#F44336; --na:#78909C;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  :root[data-theme="light"]{
    --bg:#eef1f4; --bg2:#ffffff; --card:#ffffff; --card2:#f6f8fa;
    --border:#d9e0e7; --text:#1a2027; --muted:#5b6672; --accent:#1769c2;
    --shadow:0 1px 3px rgba(0,0,0,.10);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.5;
  }
  a{color:var(--accent);text-decoration:none}
  h1,h2,h3{margin:0 0 .3em}
  h2{font-size:1.15rem}
  .wrap{max-width:1280px;margin:0 auto;padding:0 16px 80px}

  /* Header */
  header{
    background:var(--bg2);border-bottom:1px solid var(--border);
    padding:14px 16px;position:sticky;top:0;z-index:50;
  }
  .head-row{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  .head-title{font-size:1.15rem;font-weight:700}
  .head-sub{color:var(--muted);font-size:.82rem;margin-top:2px}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button.act{
    background:var(--card);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:8px 12px;font-size:.85rem;cursor:pointer;font-weight:600;
  }
  button.act:hover{border-color:var(--accent);color:var(--accent)}
  button.act.btn-export{
    background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;
  }
  button.act.btn-export:hover{filter:brightness(1.08);color:#fff}
  button.act.btn-export:disabled{opacity:.6;cursor:progress}
  #refreshMsg{font-size:.8rem;color:var(--muted);align-self:center}

  /* Section tab nav */
  nav.secnav{
    max-width:1280px;margin:10px auto 0;display:flex;gap:6px;overflow-x:auto;
    padding-bottom:4px;
  }
  nav.secnav button{
    white-space:nowrap;background:var(--card);border:1px solid var(--border);
    border-radius:999px;padding:7px 14px;font-size:.8rem;color:var(--muted);font-weight:700;
    cursor:pointer;transition:background .15s,color .15s,border-color .15s;
  }
  nav.secnav button:hover{color:var(--accent);border-color:var(--accent)}
  nav.secnav button.active{
    background:var(--accent);color:#fff;border-color:var(--accent);
  }

  /* Sections */
  @keyframes secIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  section.sec{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:18px;margin-top:18px;box-shadow:var(--shadow);
    animation:secIn .22s ease both;
  }
  section.sec[hidden]{display:none !important}

  /* While exporting a section to PDF: expand tables fully, freeze animation */
  body.exporting section.sec{animation:none !important;box-shadow:none;margin:0}
  body.exporting .tablewrap{overflow:visible !important;border-radius:0}
  body.exporting th{position:static !important}
  .sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .sec-num{
    background:var(--accent);color:#fff;border-radius:6px;font-size:.72rem;font-weight:800;
    padding:2px 7px;letter-spacing:.5px;
  }
  .sec-purpose{color:var(--muted);font-size:.85rem;margin-bottom:12px}
  .note{color:var(--muted);font-size:.8rem;margin-top:8px}

  /* Cards grid */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .kpi{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .kpi .label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:1.5rem;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .kpi .sub{font-size:.75rem;color:var(--muted);margin-top:2px}

  /* Budget bar */
  .budgetbar{position:relative;height:34px;background:var(--card2);border:1px solid var(--border);border-radius:8px;margin:14px 0 6px;overflow:hidden}
  .budgetbar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2e7d32,#4CAF50);opacity:.85}
  .budgetbar .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.5}
  .budgetbar .tick-lbl{position:absolute;top:100%;font-size:.68rem;color:var(--muted);transform:translateX(-50%);margin-top:2px;white-space:nowrap}

  /* Tables */
  .tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;margin-top:8px}
  table{border-collapse:collapse;width:100%;font-size:.83rem}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
  th{background:var(--card2);color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;cursor:pointer;user-select:none}
  th.no-sort{cursor:default}
  th .arrow{opacity:.4;font-size:.7rem}
  th.sorted .arrow{opacity:1;color:var(--accent)}
  tbody tr:hover{background:var(--card2)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  td.wrap-cell{white-space:normal;min-width:220px}
  .metricname{font-weight:700}

  /* Traffic light */
  .tl{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:.78rem;padding:2px 8px;border-radius:999px}
  .tl .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .tl.green{background:rgba(76,175,80,.15);color:var(--green)} .tl.green .dot{background:var(--green)}
  .tl.yellow{background:rgba(255,193,7,.15);color:var(--yellow)} .tl.yellow .dot{background:var(--yellow)}
  .tl.red{background:rgba(244,67,54,.15);color:var(--red)} .tl.red .dot{background:var(--red)}
  .tl.na{background:rgba(120,144,156,.15);color:var(--na)} .tl.na .dot{background:var(--na)}

  .cpl-g{color:var(--green);font-weight:700}
  .cpl-y{color:var(--yellow);font-weight:700}
  .cpl-r{color:var(--red);font-weight:700}

  .trend-up{color:var(--red)} .trend-down{color:var(--green)} .trend-flat{color:var(--muted)}

  .badge{display:inline-block;font-size:.7rem;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.4px}
  .badge.code{background:var(--accent);color:#fff}
  .badge.p-high{background:var(--red);color:#fff}
  .badge.p-med{background:var(--yellow);color:#20130b}
  .badge.p-low{background:var(--na);color:#fff}
  .badge.approval{background:rgba(244,67,54,.15);color:var(--red);border:1px solid var(--red)}
  .badge.auto{background:rgba(76,175,80,.15);color:var(--green);border:1px solid var(--green)}

  /* Flag cards */
  .flag{border-left:4px solid var(--na);background:var(--card2);border-radius:8px;padding:12px 14px;margin-top:10px}
  .flag.p1{border-left-color:var(--red)}
  .flag.p2{border-left-color:var(--yellow)}
  .flag.p3{border-left-color:var(--na)}
  .flag .f-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
  .flag .f-entity{font-weight:700}
  .flag .f-issue{font-size:.87rem;margin:4px 0}
  .flag .f-ev{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .chip{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .flag .f-act{font-size:.85rem;color:var(--text);margin-top:4px}
  .flag .f-act b{color:var(--accent)}

  /* Diagnostic cards */
  .diag{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:10px}
  .diag .d-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .diag .d-diag{font-weight:700;margin:6px 0 2px}
  .diag .d-line{font-size:.85rem;margin:3px 0}
  .diag .d-line .k{color:var(--muted);text-transform:uppercase;font-size:.68rem;letter-spacing:.4px;margin-right:6px}

  /* Checklist */
  .progress{height:12px;background:var(--card2);border:1px solid var(--border);border-radius:999px;overflow:hidden;margin:6px 0 14px}
  .progress .p-fill{height:100%;background:var(--green);width:0;transition:width .3s}
  .chk-row{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--border);border-radius:8px;margin-top:8px;background:var(--card2)}
  .chk-row input[type=checkbox]{width:20px;height:20px;margin-top:1px;cursor:pointer;flex:none}
  .chk-row.done .chk-main{opacity:.55;text-decoration:line-through}
  .chk-main{flex:1;min-width:0}
  .chk-act{font-weight:600;font-size:.9rem}
  .chk-reason{font-size:.78rem;color:var(--muted);margin-top:2px}
  .chk-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}

  .filterbtns{display:flex;gap:6px;margin:10px 0 2px;flex-wrap:wrap}
  .filterbtns button{background:var(--card2);border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:.78rem;cursor:pointer;font-weight:700}
  .filterbtns button.active{color:var(--text);border-color:var(--accent)}

  .banner{background:rgba(77,163,255,.10);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:.85rem;margin-top:14px}

  /* Executive summary box (Account Overview) */
  .exec-summary{background:var(--card2);border:1px solid var(--accent);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .exec-summary .es-title{font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin-bottom:6px}
  .exec-summary .es-status{font-size:.95rem;margin-bottom:8px}
  .exec-summary ul{margin:0;padding-left:18px}
  .exec-summary li{font-size:.85rem;margin:3px 0}

  /* Legend (collapsible footer notes) */
  .legend-head{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .legend-head b{font-size:.85rem}
  .legend-toggle{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:2px 9px;font-size:.75rem;cursor:pointer;font-weight:700}
  .legend-toggle:hover{border-color:var(--accent);color:var(--accent)}
  .legend-body{margin-top:8px}

  /* Traffic light reference table */
  .tlref-title{font-weight:700;color:var(--text);font-size:.85rem;margin-top:16px}
  .tlref-table th{position:static !important;cursor:default !important}
  .chart-box{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:12px}
  .chart-box h3{font-size:.9rem;color:var(--muted);margin-bottom:8px}
  .chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
  canvas{max-width:100%}
  .chart-wrap{position:relative;width:100%}
  .chart-wrap canvas{position:absolute;top:0;left:0;width:100% !important;height:100% !important}

  /* Remarks v2 (dashboard-side only, auto-save to localStorage, never touches artifact/data.json) */
  .remark-widget{margin-top:8px;min-width:200px}
  .remark-toggle{cursor:pointer;font-size:.76rem;color:var(--accent);font-weight:700;user-select:none;white-space:nowrap}
  .remark-toggle:hover{text-decoration:underline}
  .remark-body{margin-top:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;white-space:normal}
  .remark-history{display:flex;flex-direction:column;gap:5px;margin-bottom:8px;max-height:200px;overflow-y:auto}
  .remark-entry{font-size:.76rem;line-height:1.4}
  .remark-ts{color:var(--muted);font-weight:700;margin-right:3px}
  .remark-text{color:var(--text);white-space:pre-wrap}
  .remark-empty{font-size:.76rem;color:var(--muted);font-style:italic}
  .remark-input{width:100%;box-sizing:border-box;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 7px;font:inherit;font-size:.78rem;resize:vertical;min-height:36px}
  .remark-input:focus{outline:none;border-color:var(--accent)}
  .chk-remark{flex:0 0 240px}
  @media(max-width:820px){ .chk-row{flex-wrap:wrap} .chk-remark{flex:1 1 100%} }
  .remark-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
  .remark-modal{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;max-width:720px;width:100%;max-height:80vh;display:flex;flex-direction:column;gap:8px}
  .remark-modal textarea{width:100%;flex:1;min-height:280px;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;font-family:monospace;font-size:.75rem}
  .remark-modal .rm-actions{display:flex;gap:8px;justify-content:flex-end}

  .verdict{font-size:1rem;font-weight:700;margin:8px 0}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){ .two-col{grid-template-columns:1fr} }

  footer{max-width:1280px;margin:24px auto 0;color:var(--muted);font-size:.78rem;padding:0 16px}
  footer ul{margin:6px 0 0;padding-left:18px}

  @media print{
    header,nav.secnav,.btns,.filterbtns,#refreshMsg,.chart-box{display:none !important}
    body{background:#fff;color:#000;font-size:11px}
    section.sec{break-inside:avoid;border:1px solid #999;box-shadow:none;margin-top:10px}
    .flag,.diag,.chk-row,.kpi{break-inside:avoid}
    a{color:#000}
    :root{--card:#fff;--card2:#fff;--border:#999;--text:#000;--muted:#333}
  }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <div>
      <div class="head-title">📊 Minda Optima 2 — Pantas Baca · Daily Monitoring</div>
      <div class="head-sub" id="headSub">Account 863467445706037 · MYR · Tracking: WhatsFormSubmit</div>
    </div>
    <div class="btns">
      <span id="refreshMsg"></span>
      <button class="act" id="btnRefresh">↻ Papar Semula</button>
      <button class="act" id="btnTheme">🌓 Light / Dark</button>
      <button class="act" id="btnExportRemarks">📝 Export Remarks</button>
      <button class="act btn-export" id="btnPdf">⬇ Export as PDF</button>
    </div>
  </div>
  <nav class="secnav" id="secnav"></nav>
</header>

<div class="wrap" id="app"></div>

<footer id="footer"></footer>

<script>
/* =========================================================================
   LIVE DATA — this file fetches data.json (must sit in the same folder)
   at load time, and again whenever "Papar Semula" is clicked. This is what
   makes it work with GitHub Pages + a daily auto-updated data.json.
   NOTE: this means it no longer works via double-click file:// (browsers
   block fetch() on file://) — it must be served over http(s), e.g. GitHub Pages.
   ========================================================================= */

/* ========================= APP ========================= */
// Import satu kalkulasi bajet terus dari pautan (?mo2_calc_import=...) yang dihantar oleh kalkulator luaran.
// Simpan ke localStorage 'mo2_budget_calculations' (ganti entri bulan yang sama — bukan duplicate), papar
// semula senarai, dan bersihkan URL supaya import yang sama tak berulang bila page di-refresh/bookmark semula.
// Dipanggil selepas render() pertama (hujung init()) supaya '#savedCalcList' sudah wujud dlm DOM sebenar.
function importCalculationFromLink(){
  const params = new URLSearchParams(window.location.search);
  const importData = params.get('mo2_calc_import');
  if(!importData) return;
  try{
    const data = JSON.parse(decodeURIComponent(importData));
    let existing;
    try{ existing = JSON.parse(localStorage.getItem('mo2_budget_calculations') || '{"calculations":[]}'); }catch(e){ existing = {calculations:[]}; }
    if(!Array.isArray(existing.calculations)) existing.calculations = [];
    existing.calculations = existing.calculations.filter(c=>c.month !== data.month);
    existing.calculations.push(data);
    localStorage.setItem('mo2_budget_calculations', JSON.stringify(existing));
    renderSavedBudgetCalculations();
    window.history.replaceState({}, document.title, window.location.pathname);
    alert('✅ Budget calculation imported!');
  }catch(e){ console.error('Import failed:', e); }
}

let DATA = null;
async function fetchData(){
  const res = await fetch('data.json?_=' + Date.now());
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}
let charts = [];
let currentSection = 1;
const SEC_TITLES = ['Account','Red Flags','Campaign','Ad Set','Ads','Budget','Trend','Diagnostic','Checklist','Historical'];
const SEC_SLUGS  = ['account','red-flags','campaign','ad-set','ads','budget','trend','diagnostic','checklist','historical'];
const $ = (s,el=document)=>el.querySelector(s);
const el = (t,cls,html)=>{const e=document.createElement(t); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;};

/* formatting */
const fmtRM = n => (n==null||isNaN(n)) ? '—' : 'RM'+Number(n).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtRM0 = n => (n==null||isNaN(n)) ? '—' : 'RM'+Number(n).toLocaleString('en-MY',{maximumFractionDigits:0});
const fmtN  = n => (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('en-MY');
const fmtPct= n => (n==null||isNaN(n)) ? '—' : Number(n).toFixed(2)+'%';
const fmtX  = n => (n==null||isNaN(n)) ? '—' : Number(n).toFixed(2);

function tlClass(s){ if(!s) return 'na'; if(s.indexOf('🔴')>-1) return 'red'; if(s.indexOf('🟡')>-1) return 'yellow'; if(s.indexOf('🟢')>-1) return 'green'; return 'na'; }
function tlLabel(c){ return {red:'RED',yellow:'YELLOW',green:'GREEN',na:'N/A'}[c]; }
function tlBadge(s){ const c=tlClass(s); return '<span class="tl '+c+'"><span class="dot"></span>'+tlLabel(c)+'</span>'; }
function cplCls(v){ if(v==null||isNaN(v)) return ''; if(v<=15) return 'cpl-g'; if(v<30) return 'cpl-y'; return 'cpl-r'; }
function cplColor(v){ if(v==null||isNaN(v)) return '#78909C'; if(v<=15) return '#4CAF50'; if(v<30) return '#FFC107'; return '#F44336'; }
function cplCell(v){ return v==null||isNaN(v) ? '<td class="num">—</td>' : '<td class="num '+cplCls(v)+'">'+fmtRM(v)+'</td>'; }
function trendHTML(t){
  if(!t) return '—';
  if(t.indexOf('▲')>-1) return '<span class="trend-up">'+t+'</span>';
  if(t.indexOf('▼')>-1) return '<span class="trend-down">'+t+'</span>';
  return '<span class="trend-flat">'+t+'</span>';
}
const g = (o,k)=> (o && typeof o[k]==='number') ? o[k] : null;
const short = (s,n=30)=> !s ? '' : (s.length>n ? s.slice(0,n-1)+'…' : s);

/* ---------- Account Overview helpers (new/old-ads CPL thresholds, leads-by-source, exec summary) ---------- */
const NEW_ADS_WINS = ['yesterday','3D'];
function cplEval(win,v){
  if(v==null||isNaN(v)) return {cls:'',dot:''};
  if(NEW_ADS_WINS.indexOf(win)>-1){
    if(v<=30) return {cls:'cpl-g',dot:'🟢'};
    if(v<=55) return {cls:'cpl-y',dot:'🟡'};
    return {cls:'cpl-r',dot:'🔴'};
  }
  if(v<=15) return {cls:'cpl-g',dot:'🟢'};
  if(v<30) return {cls:'cpl-y',dot:'🟡'};
  return {cls:'cpl-r',dot:'🔴'};
}
const LEAD_SOURCE_LABELS = { whatsform_leads: 'WhatsFormSubmit' };
function leadLabel(k){ return LEAD_SOURCE_LABELS[k] || k.replace(/_leads$/,'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }
function leadSourcesFor(mObj){
  return Object.keys(mObj||{}).filter(k=>k.endsWith('_leads')).map(k=>({key:k,label:leadLabel(k),value:mObj[k]}));
}
function fmtDateShort(iso){
  if(!iso) return '—';
  const p = iso.split('-'); if(p.length<3) return iso;
  const months=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
  return p[2]+' '+months[Number(p[1])-1]+' '+p[0];
}
function buildExecSummary(){
  const acc = DATA.section_3_account_overview;
  const budget = DATA.section_1_budget_card || {};
  const camp = (DATA.section_5_campaign_summary && DATA.section_5_campaign_summary.campaigns) || [];
  const adsets = (DATA.section_6_adset_summary && DATA.section_6_adset_summary.adsets) || [];
  const ads = (DATA.section_7_ads_performance && DATA.section_7_ads_performance.ads_14D) || [];
  const flags = (DATA.section_2_red_flags && DATA.section_2_red_flags.flags) || [];
  const trend = DATA.section_4_performance_trend || {};

  const activeCamp = camp.filter(c=>/ACTIVE/i.test(c.status||''));
  const campRed = camp.filter(c=>tlClass(c.traffic_light)==='red');
  const adsetsGreen = adsets.filter(a=>tlClass(a.traffic_light)==='green');
  const adsetsRed = adsets.filter(a=>tlClass(a.traffic_light)==='red');

/* ---------- Sortable table helper ---------- */
function buildTable(cols, rows, opts={}){
  const wrap = el('div','tablewrap');
  const table = el('table');
  const thead = el('thead');
  const trh = el('tr');
  let sortState = opts.defaultSort ? {key:opts.defaultSort, dir:opts.defaultDir||'desc'} : null;

  cols.forEach(c=>{
    const th = el('th', c.sortable===false?'no-sort':'', c.label + (c.sortable===false?'':' <span class="arrow">↕</span>'));
    if(c.sortable!==false){
      th.addEventListener('click',()=>{
        if(sortState && sortState.key===c.key){ sortState.dir = sortState.dir==='asc'?'desc':'asc'; }
        else { sortState = {key:c.key, dir:c.numeric?'desc':'asc'}; }
        renderBody();
        [...trh.children].forEach(x=>x.classList.remove('sorted'));
        th.classList.add('sorted');
        th.querySelector('.arrow').textContent = sortState.dir==='asc'?'↑':'↓';
      });
    }
    trh.appendChild(th);
  });
  thead.appendChild(trh); table.appendChild(thead);
  const tbody = el('tbody'); table.appendChild(tbody);

  function renderBody(){
    let r = rows.slice();
    if(sortState){
      const c = cols.find(x=>x.key===sortState.key);
      r.sort((a,b)=>{
        let va = c.sortVal ? c.sortVal(a) : a[c.key];
        let vb = c.sortVal ? c.sortVal(b) : b[c.key];
        if(va==null) va = c.numeric ? -Infinity : '';
        if(vb==null) vb = c.numeric ? -Infinity : '';
        if(c.numeric) return sortState.dir==='asc' ? va-vb : vb-va;
        return sortState.dir==='asc' ? String(va).localeCompare(vb) : String(vb).localeCompare(va);
      });
    }
    tbody.innerHTML = r.map(row=>'<tr>'+cols.map(c=>c.cell(row)).join('')+'</tr>').join('');
  }
  renderBody();
  wrap.appendChild(table);
  return wrap;
}

function showImportCalcModal(){

      '<b>📥 Import Budget Calculation</b>'+

      '</div>'+
    '</div>';
  document.body.appendChild(bg);
  bg.querySelector('#importCalcCloseBtn').addEventListener('click',()=>bg.remove());
  bg.addEventListener('click',e=>{ if(e.target===bg) bg.remove(); });
  bg.querySelector('#importCalcBtn').addEventListener('click',()=>{
    const raw = bg.querySelector('#importCalcTa').value.trim();
    if(!raw) return;
    try{
      const calc = JSON.parse(raw);
      if(!calc || !calc.month || !calc.results) throw new Error('bad format');
      let existing;
      try{ existing = JSON.parse(localStorage.getItem('mo2_budget_calculations') || '{"calculations":[]}'); }catch(e){ existing = {calculations:[]}; }
      if(!Array.isArray(existing.calculations)) existing.calculations = [];
      existing.calculations = existing.calculations.filter(c=>c.month !== calc.month);
      existing.calculations.push(calc);
      localStorage.setItem('mo2_budget_calculations', JSON.stringify(existing));
      renderSavedBudgetCalculations();
      bg.remove();
      alert('✅ Budget calculation imported!');
    }catch(e){
      alert('❌ Gagal import - pastikan JSON yang dipaste betul (dari butang Copy ke Dashboard di Calculator).');
    }
  });
}

function renderSavedBudgetCalculations(scope){
  const list = (scope||document).querySelector('#savedCalcList');
  if(!list) return;
  let data;
  try{ data = JSON.parse(localStorage.getItem('mo2_budget_calculations')||'null'); }catch(e){ data = null; }
  const calculations = (data && data.calculations) || [];
  if(!calculations.length){ list.innerHTML = '<p style="color:var(--muted)">Tiada data simpanan lagi.</p>'; return; }
  const sorted = calculations.slice().sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  list.innerHTML = sorted.map((calc,i)=>calcDetailHTML(calc,i)).join('');
}

function render3(){
  const d = DATA.section_3_account_overview;
  const s = section(1,'📈 Account Overview', d.purpose+' · Basis CPL: '+d.cpl_basis);

  s.insertAdjacentHTML('beforeend', buildExecSummary());

  const wins = [['Yesterday','yesterday'],['3D','3D'],['7D','7D'],['14D','14D'],['30D','30D']];
  const m = d.metrics;
  const ty = d.total_this_year || {};
  const tyTypes = ty.conversion_types || []; // auto-detect: whatever conversion types exist here get rendered

  const rowsDef = [
    { key:'spend', label:'Spend' },
    { key:'whatsform_leads', label:'Leads', isLeads:true },
    { key:'cpl', label:'CPL', isCpl:true },
    { key:'impressions', label:'Impressions' },
    { key:'reach', label:'Reach' },
    { key:'frequency', label:'Frequency', isFreq:true }
  ];
  const fmtFor = (rd,v)=> (rd.key==='spend'||rd.isCpl) ? fmtRM(v) : rd.isFreq ? fmtX(v) : fmtN(v);

  function windowCell(rd, winKey){
    const mo = m[winKey] || {};
    if(rd.isLeads){
      const srcs = leadSourcesFor(mo);
      if(!srcs.length) return '<td class="num">—</td>';
      return '<td class="num">'+srcs.map(x=>x.label+': <b>'+fmtN(x.value)+'</b>').join('<br>')+'</td>';
    }
    if(rd.isCpl){
      const v = mo.cpl;
      if(v==null||isNaN(v)) return '<td class="num">—</td>';
      const ev = cplEval(winKey, v);
      return '<td class="num '+ev.cls+'">'+ev.dot+' '+fmtRM(v)+'</td>';
    }
    return '<td class="num">'+fmtFor(rd, mo[rd.key])+'</td>';
  }
  function totalCell(rd){
    if(rd.isLeads){
      if(!tyTypes.length) return '<td class="num">—</td>';
      const lines = tyTypes.map(t=>t.label+': <b>'+fmtN(t.results)+'</b>');
      const totalAll = tyTypes.reduce((a,t)=>a+(t.results||0),0);
      lines.push('<b>Jumlah: '+fmtN(totalAll)+'</b>');
      const title = 'Tempoh: '+(ty.period||'')+(ty.excluded_note?' — '+ty.excluded_note:'');
      return '<td class="num" title="'+title+'">'+lines.join('<br>')+'</td>';
    }
    if(rd.isCpl){
      if(!tyTypes.length && !ty.combined) return '<td class="num">—</td>';
      const lines = tyTypes.map(t=>t.label+': <b>'+fmtRM(t.cpl)+'</b>');
      if(ty.combined) lines.push('<b>Gabungan: '+fmtRM(ty.combined.cpl)+'</b>');
      const title = 'Tempoh: '+(ty.period||'');
      return '<td class="num" title="'+title+'">'+lines.join('<br>')+'</td>';
    }
    // spend / impressions / reach / frequency — direct account-level totals for the period
    const v = ty[rd.key];
    if(v==null) return '<td class="num">—</td>';
    return '<td class="num" title="Tempoh: '+(ty.period||'')+'">'+fmtFor(rd, v)+'</td>';
  }

  let html='<div class="tablewrap"><table><thead><tr>'+
      '<th class="no-sort">Metrik</th>'+
      wins.map(w=>'<th class="no-sort">'+w[0]+'</th>').join('')+
      '<th class="no-sort">Total (Tahun Ini)</th>'+
    '</tr></thead><tbody>';
  rowsDef.forEach(rd=>{
    html += '<tr><td class="metricname">'+rd.label+'</td>'+
      wins.map(w=>windowCell(rd,w[1])).join('')+
      totalCell(rd)+
      '</tr>';
  });
  html+='</tbody></table></div>';
  s.insertAdjacentHTML('beforeend',html);
  if(ty.note){
    s.appendChild(el('div','note','ⓘ Total (Tahun Ini): '+ty.note));
  }

  s.insertAdjacentHTML('beforeend',
    '<div class="tlref-title">Rujukan Ambang Traffic Light</div>'+
    '<div class="tablewrap tlref-table"><table><tbody>'+
      '<tr><th colspan="2">New Ads / Testing (Yesterday, 3D)</th></tr>'+
      '<tr><td>🟢 GREEN</td><td>CPL RM0 – RM30</td></tr>'+
      '<tr><td>🟡 YELLOW</td><td>CPL RM31 – RM55</td></tr>'+
      '<tr><td>🔴 RED</td><td>CPL RM56+</td></tr>'+
      '<tr><th colspan="2">Old / Established Ads (7D, 14D, 30D)</th></tr>'+
      '<tr><td>🟢 GREEN</td><td>CPL RM0 – RM15</td></tr>'+
      '<tr><td>🟡 YELLOW</td><td>CPL RM15.01 – RM29.99</td></tr>'+
      '<tr><td>🔴 RED</td><td>CPL RM30+</td></tr>'+
    '</tbody></table></div>');

  const t = d.trend_7D_vs_14D;
  s.appendChild(el('div','banner',
    '<b>Traffic light akaun (CPL):</b> '+tlBadge(d.traffic_light_account_cpl)+' — '+d.traffic_light_account_cpl+'<br>'+
    '<b>Trend 7D vs 14D:</b> CPL '+trendHTML(t.cpl)+' · CTR '+trendHTML(t.ctr)+' · CPC '+trendHTML(t.cpc)+' · CPM '+trendHTML(t.cpm)+'<br>'+
    '<b>Trend bulanan (30D → 7D):</b> '+trendHTML(t.cpl_vs_30D)));
  return s;
}

/* ---------- Remarks v2 (dashboard-side only — auto-save to localStorage, NEVER touches data.json/artifact) ----------
   Setiap entiti (campaign/ad set/ad/red-flag/checklist) simpan SATU SENARAI (log) catatan berstempel masa,
   bukan satu teks tunggal — supaya sejarah tindakan tak hilang bila catatan baru ditambah.
   Struktur storan: { [key]: [ {ts:"YYYY-MM-DD HH:MM", text:"..."}, ... ] }  — entri terbaru di HADAPAN (index 0).
   Guna butang "📝 Export Remarks" untuk kumpul SEMUA sejarah jadi satu JSON — copy & hantar kat Claude semasa /update-dashboard. */
const LS_REMARKS_V1 = 'mo2_remarks_v1';   // format lama (single text) — dibaca sekali sahaja untuk migrate
const LS_REMARKS    = 'mo2_remarks_v2';   // format baharu (log berstempel masa)

function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtStamp(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function nowStamp(){ return fmtStamp(new Date()); }

function loadRemarksV2(){ try{ return JSON.parse(localStorage.getItem(LS_REMARKS)||'{}'); }catch(e){ return {}; } }
function saveRemarksV2(o){ try{ localStorage.setItem(LS_REMARKS, JSON.stringify(o)); }catch(e){} }

// Auto-migrate v1 (single {text,updatedAt} per key) -> v2 (array of {ts,text} per key), once.
(function migrateRemarksV1toV2(){
  try{
    if(localStorage.getItem(LS_REMARKS)) return; // v2 already exists — never overwrite
    const raw = localStorage.getItem(LS_REMARKS_V1);
    if(!raw) return;
    const v1 = JSON.parse(raw);
    const v2 = {};
    Object.keys(v1||{}).forEach(k=>{
      const r = v1[k];
      if(r && r.text && String(r.text).trim()){
        const d = r.updatedAt ? new Date(r.updatedAt) : new Date();
        v2[k] = [{ ts: isNaN(d) ? nowStamp() : fmtStamp(d), text: r.text }];
      }
    });
    if(Object.keys(v2).length) saveRemarksV2(v2);
  }catch(e){}
})();

function getRemarkEntries(key){
  const all = loadRemarksV2();
  return Array.isArray(all[key]) ? all[key] : [];
}
function appendRemarkEntry(key, text){
  const all = loadRemarksV2();
  if(!Array.isArray(all[key])) all[key] = [];
  all[key].unshift({ ts: nowStamp(), text: text }); // newest first
  saveRemarksV2(all);
}

// Renders the 3-part remark UI: collapsed toggle -> expand -> history log (newest on top) + input box.
function remarkWidgetHTML(key, expanded){
  const entries = getRemarkEntries(key);
  const count = entries.length;
  const historyHTML = entries.length
    ? entries.map(e=>'<div class="remark-entry"><span class="remark-ts">['+esc(e.ts)+']</span> <span class="remark-text">'+esc(e.text)+'</span></div>').join('')
    : '<div class="remark-empty">Tiada catatan lagi.</div>';
  return (
    '<div class="remark-widget" data-remark-key="'+esc(key)+'">'+
      '<div class="remark-toggle">📝 Remark (<span class="remark-count">'+count+'</span> entries) <span class="remark-caret">'+(expanded?'▲':'▼')+'</span></div>'+
      '<div class="remark-body"'+(expanded?'':' hidden')+'>'+
        '<div class="remark-history">'+historyHTML+'</div>'+
        '<textarea class="remark-input" placeholder="Tambah catatan baru... (auto-save bila klik luar kotak ni)" rows="2"></textarea>'+
      '</div>'+
    '</div>'
  );
}
// Toggle expand/collapse — event delegation (widgets get rebuilt on table sort/filter/re-render).
document.addEventListener('click', e=>{
  const toggle = e.target.closest && e.target.closest('.remark-toggle');
  if(!toggle) return;
  const widget = toggle.closest('.remark-widget');
  const body = widget.querySelector('.remark-body');
  body.hidden = !body.hidden;
  const caret = toggle.querySelector('.remark-caret');
  if(caret) caret.textContent = body.hidden ? '▼' : '▲';
});
// Auto-append on blur (focusout bubbles, unlike blur) — never overwrite, always append a new timestamped entry.
// The outerHTML swap is deferred with setTimeout: replacing/removing the element from inside its own
// blur/focusout handler can throw "NotFoundError: ...Perhaps it was moved in a 'blur' event handler" in
// some browsers, since that counts as moving the very node whose blur is still being processed.
document.addEventListener('focusout', e=>{
  const ta = e.target;
  if(!(ta && ta.classList && ta.classList.contains('remark-input'))) return;
  const text = ta.value.trim();
  if(!text) return;
  const widget = ta.closest('.remark-widget');
  const key = widget.dataset.remarkKey;
  appendRemarkEntry(key, text);
  setTimeout(()=>{ widget.outerHTML = remarkWidgetHTML(key, true); }, 0); // stay expanded so the new entry is visible
});

function exportRemarksJSON(){
  const o = loadRemarksV2();
  const keys = Object.keys(o).filter(k=>Array.isArray(o[k]) && o[k].length);
  const payload = {
    exported_at: new Date().toISOString(),
    account: (typeof DATA!=='undefined' && DATA._meta) ? DATA._meta.account_id : undefined,
    count: keys.length,
    remarks: keys.map(k=>({ key:k, entries:o[k] }))
  };
  return JSON.stringify(payload, null, 2);
}
function showExportRemarksModal(){

      '<textarea readonly onclick="this.select()">'+esc(json)+'</textarea>'+

    catch(e){ document.execCommand('copy'); bg.querySelector('#rmCopyBtn').textContent='✅ Disalin'; }
    setTimeout(()=>{ const b=bg.querySelector('#rmCopyBtn'); if(b) b.textContent='📋 Copy'; },1500);
  });
}

/* ---------- Section tabs: show one, hide the rest ---------- */
function showSection(n){
  currentSection = n;
  for(let i=1;i<=10;i++){
    const sec = document.getElementById('s'+i);
    if(sec) sec.hidden = (i!==n);
  }
  document.querySelectorAll('#secnav button').forEach(b=>{
    b.classList.toggle('active', Number(b.dataset.sec)===n);
  });
  // charts inside a hidden section render at 0px — resize once it is visible
  requestAnimationFrame(()=>{ charts.forEach(c=>{ try{ c.resize(); }catch(e){} }); });
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- Export visible section as PDF ---------- */
const cssVar = n => (getComputedStyle(document.documentElement).getPropertyValue(n)||'').trim();
async function exportSectionPDF(){
  const btn = $('#btnPdf'), msg = $('#refreshMsg');
  const target = document.getElementById('s'+currentSection);
  if(!target) return;
  const slug = SEC_SLUGS[currentSection-1];
  const fname = slug+'-'+new Date().toISOString().slice(0,10)+'.pdf';

  if(typeof html2canvas==='undefined' || !window.jspdf){
    msg.textContent='⚠ Pustaka PDF tak dimuat (perlu internet). Membuka dialog Print → pilih "Save as PDF".';
    setTimeout(()=>{ msg.textContent=''; }, 8000);
    window.print();
    return;
  }

  btn.disabled = true;
  const oldLabel = btn.textContent;
  btn.textContent = '⏳ Menyedia PDF…';
  msg.textContent = 'Merakam "'+SEC_TITLES[currentSection-1]+'"…';
  const bg = cssVar('--bg') || '#0f141a';

  document.body.classList.add('exporting');
  target.style.width = 'max-content';
  await new Promise(r=>setTimeout(r, 80));
  const capW = Math.min(2600, Math.max(target.scrollWidth, 920));

  try{
    const canvas = await html2canvas(target, {
      scale: 2, backgroundColor: bg, width: capW, windowWidth: capW,
      scrollX: 0, scrollY: -window.scrollY, useCORS: true, logging: false
    });
    target.style.width = '';
    document.body.classList.remove('exporting');

    const { jsPDF } = window.jspdf;
    const landscape = canvas.width >= canvas.height;
    const pdf = new jsPDF({ orientation: landscape ? 'l' : 'p', unit: 'pt', format: 'a4' });
    const M = 22;
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW  = pageW - M*2;
    const pxPerPt = canvas.width / imgW;
    const fullH = canvas.height / pxPerPt;

    if(fullH <= pageH - M*2){
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', M, M, imgW, fullH);
    } else {
      const chunkPx = Math.floor((pageH - M*2) * pxPerPt);
      const tmp = document.createElement('canvas');
      const ctx = tmp.getContext('2d');
      let sy = 0, page = 0;
      while(sy < canvas.height){
        const sh = Math.min(chunkPx, canvas.height - sy);
        tmp.width = canvas.width; tmp.height = sh;
        ctx.fillStyle = bg; ctx.fillRect(0, 0, tmp.width, tmp.height);
        ctx.drawImage(canvas, 0, sy, canvas.width, sh, 0, 0, canvas.width, sh);
        if(page > 0) pdf.addPage();
        pdf.addImage(tmp.toDataURL('image/png'), 'PNG', M, M, imgW, sh / pxPerPt);
        sy += sh; page++;
      }
    }
    pdf.save(fname);
    msg.textContent = '✓ PDF dimuat turun: '+fname;
  }catch(e){
    target.style.width = '';
    document.body.classList.remove('exporting');
    msg.textContent = '⚠ Gagal jana PDF ('+(e && e.message || e)+'). Cuba Print → Save as PDF.';
  }finally{
    btn.disabled = false;
    btn.textContent = oldLabel;
    setTimeout(()=>{ if(msg.textContent.startsWith('✓')||msg.textContent.startsWith('⚠')) msg.textContent=''; }, 9000);
  }
}
$('#btnPdf').addEventListener('click', exportSectionPDF);
